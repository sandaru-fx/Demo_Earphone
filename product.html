<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | Aura Audio</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        .product-detail-section {
            padding: 120px 0 80px;
        }

        .product-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
        }

        /* Image Gallery */
        .product-gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .main-image {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: var(--border-radius);
            height: 500px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .main-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .thumbnail-strip {
            display: flex;
            gap: 15px;
        }

        .thumbnail {
            width: 80px;
            height: 80px;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .thumbnail.active {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Product Info */
        .product-info-panel h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .rating-reviews {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: var(--text-secondary);
        }

        .rating-reviews i {
            color: var(--gold);
        }

        .price-block {
            font-size: 2rem;
            color: var(--accent-cyan);
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .price-block .original-price {
            font-size: 1.2rem;
            color: var(--text-secondary);
            text-decoration: line-through;
            font-weight: normal;
        }

        .description {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.8;
        }

        .features-list {
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .features-list li {
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .features-list i {
            color: var(--accent-purple);
        }

        /* Selectors */
        .selector-group {
            margin-bottom: 30px;
        }

        .selector-group h4 {
            margin-bottom: 15px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .color-options {
            display: flex;
            gap: 15px;
        }

        .color-swatch {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            outline: 2px solid var(--glass-border);
            outline-offset: 2px;
            transition: all 0.3s;
        }

        .color-swatch.active {
            outline-color: var(--accent-cyan);
        }

        .action-group {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }

        .quantity-selector {
            display: flex;
            align-items: center;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 5px 15px;
        }

        .quantity-btn {
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px 10px;
        }

        .quantity-input {
            width: 40px;
            background: none;
            border: none;
            color: var(--text-primary);
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
            outline: none;
        }

        .add-to-cart-btn {
            flex: 1;
            padding: 15px;
            font-size: 1.1rem;
        }

        @media (max-width: 900px) {
            .product-container {
                grid-template-columns: 1fr;
            }
            .main-image {
                height: 400px;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo text-gradient">AURA.</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html" style="color: var(--accent-cyan);">Shop</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-icons">
                <i class="ri-search-line"></i>
                <a href="cart.html" style="position:relative;">
                    <i class="ri-shopping-cart-2-line"></i>
                    <span class="cart-count" style="position:absolute; top:-8px; right:-8px; background:var(--accent-purple); color:white; font-size:10px; padding:2px 5px; border-radius:50%;">0</span>
                </a>
                <i class="ri-menu-line" style="display: none;"></i>
            </div>
        </div>
    </nav>

    <!-- Content injected by JS -->
    <section class="product-detail-section container" id="product-detail-container">
        <!-- Loading state -->
        <div style="text-align: center; padding: 100px; color: var(--text-secondary);">Loading product details...</div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-grid">
                <div class="footer-col">
                    <h3 class="text-gradient" style="font-size: 1.5rem;">AURA.</h3>
                    <p>Redefining your listening experience with premium, high-fidelity audio equipment.</p>
                </div>
                <div class="footer-col">
                    <h3>Shop</h3>
                    <ul class="footer-links">
                        <li><a href="shop.html">True Wireless</a></li>
                        <li><a href="shop.html">Over-Ear</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Aura Audio. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/products.js"></script>
    <script src="js/product-detail.js"></script>
    <script>
        window.addEventListener('scroll', () => {
            const navbar = document.querySelector('.navbar');
            if (window.scrollY > 50) {
                navbar.style.background = 'rgba(10, 10, 15, 0.95)';
                navbar.style.boxShadow = '0 4px 30px rgba(0, 0, 0, 0.5)';
            } else {
                navbar.style.background = 'rgba(18, 18, 26, 0.7)';
                navbar.style.boxShadow = 'none';
            }
        });
    </script>
</body>
</html>
